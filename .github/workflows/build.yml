
name: SAKHO UZB Keyboard Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify source files
        shell: pwsh
        run: |
          Get-ChildItem -Name
          foreach ($file in @("UZB.C", "UZB.H", "UZB.DEF", "UZB.RC")) {
            if (-not (Test-Path $file)) {
              throw "Missing source file: $file"
            }
          }

            - name: Check MSVC build tools
              shell: cmd
              run: |
                for /f "usebackq delims=" %i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%%i"
                if not defined VS_PATH (
                  echo ERROR: Visual Studio C++ Build Tools not found.
                  exit /b 1
                )
                call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
                where cl
                where link
                where rc
                cl /Bv
