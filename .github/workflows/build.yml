name: SAKHO UZB Keyboard Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify source files
        shell: pwsh
        run: |
          foreach ($file in @("UZB.C", "UZB.H", "UZB.DEF", "UZB.RC", "kbd.h")) {
            if (-not (Test-Path $file)) { throw "Missing source file: $file" }
          }

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build UZB keyboard DLL x64
        shell: cmd
        run: |
          rc /nologo /fo UZB.res UZB.RC || exit /b 1
          cl /nologo /c /W3 /O2 /GS- /I. /DWIN32 /D_WINDOWS /D_AMD64_ UZB.C /Fo:UZB.obj || exit /b 1
          link /nologo /DLL /MACHINE:X64 /OUT:UZB.dll /DEF:UZB.DEF UZB.obj UZB.res /NODEFAULTLIB /ENTRY:DllMain || exit /b 1
          dumpbin /exports UZB.dll || exit /b 1

      - name: Upload UZB DLL
        uses: actions/upload-artifact@v4
        with:
          name: SAKHO-UZB-Keyboard-x64
          path: UZB.dll
          if-no-files-found: error
