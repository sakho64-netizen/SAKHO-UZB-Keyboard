name: SAKHO UZB Keyboard Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify source files
        shell: pwsh
        run: |
          Get-ChildItem -Name

          foreach ($file in @("UZB.C", "UZB.H", "UZB.DEF", "UZB.RC")) {
            if (-not (Test-Path $file)) {
              throw "Missing source file: $file"
            }
          }

          Write-Host "All keyboard source files found."

      - name: Check MSVC build tools
        shell: cmd
        run: |
          @echo off
          setlocal

          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"

          if not exist "%VSWHERE%" (
            echo ERROR: vswhere.exe not found.
            exit /b 1
          )

          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%%i"

          if not defined VS_PATH (
            echo ERROR: Visual Studio C++ Build Tools not found.
            exit /b 1
          )

          echo Visual Studio found at:
          echo %VS_PATH%

          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"

          if errorlevel 1 exit /b 1

          where cl.exe
          if errorlevel 1 exit /b 1

          where link.exe
          if errorlevel 1 exit /b 1

          where rc.exe
          if errorlevel 1 exit /b 1

          cl /Bv
          if errorlevel 1 exit /b 1

          echo MSVC build environment is ready.

